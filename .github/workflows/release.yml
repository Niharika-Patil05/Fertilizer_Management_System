name: Release images

# Publishes versioned frontend + backend images to GitHub Container Registry (GHCR).
# Trigger: push a tag like v1.1.0  (git tag v1.1.0 && git push origin v1.1.0)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.1.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
          echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Guard - VERSION, release.json and the tag must all agree
        run: |
          WANT="${{ steps.v.outputs.version }}"
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          JSON_VER="$(jq -r '.version' release.json)"
          echo "tag=$WANT  VERSION=$FILE_VER  release.json=$JSON_VER"
          if [ "$FILE_VER" != "$WANT" ] || [ "$JSON_VER" != "$WANT" ]; then
            echo "::error::Version mismatch. Set VERSION and release.json .version to $WANT, commit, then re-tag."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ steps.v.outputs.owner_lc }}/fms-backend:${{ steps.v.outputs.version }}
            ghcr.io/${{ steps.v.outputs.owner_lc }}/fms-backend:stable

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          build-args: |
            REACT_APP_API_URL=/api
            REACT_APP_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ steps.v.outputs.owner_lc }}/fms-frontend:${{ steps.v.outputs.version }}
            ghcr.io/${{ steps.v.outputs.owner_lc }}/fms-frontend:stable
